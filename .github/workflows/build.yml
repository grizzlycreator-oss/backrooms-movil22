name: Compilar APK y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Copiar el juego dentro del APK
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets
          cp -r www android/app/src/main/assets/www

      - name: Compilar
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk Backrooms-Movil22.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Backrooms-Movil22
          path: Backrooms-Movil22.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Backrooms Móvil 22 (versión ${{ github.run_number }})
          make_latest: true
          body: |
            Descargá **Backrooms-Movil22.apk** desde el celular Android e instalalo.
            iPhone: jugá desde la página del juego y agregala a la pantalla de inicio.
          files: Backrooms-Movil22.apk

  web:
    name: Página para iPhone
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
