plugins {
    id 'com.android.application'
}

android {
    namespace 'com.movil22.backrooms'
    compileSdk 34

    defaultConfig {
        applicationId "com.movil22.backrooms"
        minSdk 24
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") ? System.getenv("GITHUB_RUN_NUMBER").toInteger() : 1)
        versionName "1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
    }

    signingConfigs {
        juego {
            storeFile file("juego.keystore")
            storePassword "backrooms22"
            keyAlias "movil22"
            keyPassword "backrooms22"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.juego
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'wav', 'png'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
